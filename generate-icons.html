<!DOCTYPE html>
<html>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  ctx.fillStyle = '#7c6aff';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.2);
  ctx.fill();
  ctx.strokeStyle = 'white';
  ctx.lineWidth = s * 0.05;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // checkmark circle
  ctx.beginPath();
  ctx.arc(s/2, s/2, s*0.3, 0, Math.PI*2);
  ctx.stroke();
  // checkmark
  ctx.beginPath();
  ctx.moveTo(s*0.33, s*0.5);
  ctx.lineTo(s*0.45, s*0.63);
  ctx.lineTo(s*0.67, s*0.37);
  ctx.stroke();
}
drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));

// Download
['c192','c512'].forEach(id => {
  const c = document.getElementById(id);
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = id === 'c192' ? 'icon-192.png' : 'icon-512.png';
  a.textContent = 'Download ' + a.download;
  document.body.appendChild(a);
  document.body.appendChild(document.createElement('br'));
});
</script>
</body>
</html>
